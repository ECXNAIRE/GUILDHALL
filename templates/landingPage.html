<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        @font-face {
            font-family: "font2";
            src: url("../static/fonts/Cinzel-Regular.otf") format("otf");
        }

        body{
            background: #EAD7AE;
        }


        #logoArea {
            position: absolute;
            top:70px;
            left:50%;
            transform: translateX(-50%);
            font-family: font2;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto
        }

        #g {
            font-size: 150px;
            font-weight: 1000;
            color: #B08D57;
            -webkit-text-stroke: 2px #4A2D14;

            text-shadow:
                0px -1px 0px #E7C97A,
                0px 1px 0px #8A6938,
                2px 2px 0px #2B1708,
                4px 4px 6px rgba(0, 0, 0, 0.35);

            user-select: none;
        }

        #uildhall {
            font-size: 110px;
            font-weight: 1000;
            color: #B08D57;
            -webkit-text-stroke: 2px #4A2D14;

            text-shadow:
                0px -1px 0px #E7C97A,
                0px 1px 0px #8A6938,
                2px 2px 0px #2B1708,
                4px 4px 6px rgba(0, 0, 0, 0.35);

            user-select: none;
        }

        #loginArea {
            position: absolute;
            top:250px;
            left:50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div id="logoArea">
        <span id="g">G</span><span id="uildhall">UILDHALL</span>
    </div>

    <div id="loginArea">
        <button>GOOGLE LOGIN</button>
        <button>HACKCLUB LOGIN</button>
        <button>GITHUB LOGIN</button>
    </div>

</body>

</html>
