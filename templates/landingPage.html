<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        @font-face {
            font-family: "font2";
            src: url("../static/fonts/Cinzel-Regular.otf") format("otf");
        }

        @font-face {
            font-family: "font1";
            src: url("../static/fonts/Excalifont-Regular.woff2") format("woff2");
        }

        html {
            user-select: none;
        }

        body {
            background: #EAD7AE;
        }


        #logoArea {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-family: font2;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto
        }

        #g {
            font-size: 150px;
            font-weight: 1000;
            color: #B08D57;
            -webkit-text-stroke: 2px #4A2D14;

            text-shadow:
                0px -1px 0px #E7C97A,
                0px 1px 0px #8A6938,
                2px 2px 0px #2B1708,
                4px 4px 6px rgba(0, 0, 0, 0.35);

            user-select: none;
        }

        #uildhall {
            font-size: 110px;
            font-weight: 1000;
            color: #B08D57;
            -webkit-text-stroke: 2px #4A2D14;

            text-shadow:
                0px -1px 0px #E7C97A,
                0px 1px 0px #8A6938,
                2px 2px 0px #2B1708,
                4px 4px 6px rgba(0, 0, 0, 0.35);

            user-select: none;
        }

        #loginArea {
            position: absolute;
            top: 290px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: auto;
            height: auto;
            gap: 10px
        }



        .loginBtns {
            font-family: font1;
            width: 300px;
            height: 45px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.1s ease;
        }

        .loginBtns:hover {
            cursor: pointer;
            transform: scale(1.01);
        }

        #githubLogin {
            border-top: 2px solid #6A6A6A;
            border-left: 2px solid #6A6A6A6A;
            border-right: 4px solid #1A1A1A;
            border-bottom: 4px solid #1A1A1A;
            background: #3A3A3A;
            color: #F2F2F2
        }

        #googleLogin {
            border-top: 2px solid #FFF8E8;
            border-left: 2px solid #FFF8E8;
            border-right: 4px solid #B89A68;
            border-bottom: 4px solid #B89A68;
            background: #F5E6C8;

        }

        #hackclubLogin {
            border-top: 2px solid #E57B68;
            border-left: 2px solid #E57B68;
            border-right: 4px solid #7A241A;
            border-bottom: 4px solid #7A241A;
            background: #D34A3A;
            color: #FFF6E8
        }

        #divider {
            width: 350px;
            display: flex;
            align-items: center;
            margin: 6px 0;
        }

        #divider::before,
        #divider::after {
            content: "";
            flex: 1;
            height: 2px;
            background: #9A7B47;
        }

        #divider span {
            margin: 0 12px;
            color: #6B4A1F;
            font-family: font1;
            font-size: 14px;
            font-weight: bold;
        }

        #note {
            position: absolute;
            top: 520px;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            text-align: center;
            font-family: font1;
            font-size: 14px;
            line-height: 1.5;
            color: #6B4A1F;
            opacity: 0.85;
            user-select: none;
        }

        #note span {
            color: red;
            font-size: 18px;
            font-weight: 700;
        }

        #note2 {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            text-align: center;
            font-family: font1;
            font-size: 22px;
            line-height: 1.5;
            color: #6B4A1F;
            opacity: 0.85;
            user-select: none;
        }
    </style>
</head>

<body>
    <div id="logoArea">
        <span id="g">G</span><span id="uildhall">UILDHALL</span>
    </div>
    <div id="note2">
        Beyond these gates, creators unite, knowledge is shared, and great works are forged by those who dare to build
        beyond imagination.
    </div>

    <div id="loginArea">
        <button class="loginBtns" id="googleLogin" onclick="window.location.href='/googleLogin'">GOOGLE LOGIN</button>

        <div id="divider">
            <span>OR</span>
        </div>

        <button class="loginBtns" id="hackclubLogin">HACKCLUB LOGIN</button>
        <button class="loginBtns" id="githubLogin" onclick="window.location.href='/githubLogin'">GITHUB LOGIN</button>
    </div>

    <div id="note">
        <span> ! </span>Don't worry, we only use your login to identify you as a guild member. No unnecessary
        permissions, no spam.
    </div>

</body>

</html>
