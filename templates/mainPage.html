<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        *{
            box-sizing: border-box;
        }

        html,
        body{
            width:100%;
            height:100%;
            margin:0;
            overflow:hidden;
            background:#f5f5f5;
        }

        #canvasArea{
            position:absolute;
            bottom: 10px;
            right: 10px;
            height: calc(100vh - 20px);
            width: calc(100vw - 95px);
            border: 2px solid black;
            border-radius: 12px;
        }

        canvas{
            width:100%;
            height:100%;
            display:block;
            border-radius: 12px;
        }

        #topArea{
            position:absolute;
            top:10px;
            left:10px;
            width:65px;
            height:45px;
            border:2px solid black;
            background:white;
            border-radius:12px;
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:10;
        }

        #nav{
            position:absolute;
            top:65px;
            left:10px;
            width:65px;
            height:500px;
            border:2px solid black;
            background:white;
            border-radius:12px;
            display:flex;
            justify-content:center;
            align-items:center;
            z-index:10;
        }

        #addQuestButtonArea {
            position: absolute;
            top: 20px;
            right: 20px;
            height: 55px;
            width: 55px;
            border: 2px solid black;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <div id="addQuestButtonArea">

    </div>

    <div id="topArea">
    </div>

    <div id="nav">
    </div>

    <div id="canvasArea">
        <canvas></canvas>
    </div>

</body>
</html>
