<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f5f5f5;
        }

        body{
            background: #E8DFC8;
        }

        #canvasArea {
            position: absolute;
            bottom: 20px;
            right: 100px;
            height: 632px;
            width: 1000px;
            border: 2px solid rgba(0, 0, 0, 0);
            border-radius: 12px;
        }

        #worldCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        #uiCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #topArea {
            position: absolute;
            top: 30px;
            left: 10px;
            width: 200px;
            height: 45px;
            border: 2px solid black;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #nav {
            position: absolute;
            top: 85px;
            left: 10px;
            width: 200px;
            height: 500px;
            border: 2px solid black;
            background: white;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #addQuestButtonArea {
            position: absolute;
            top: 100px;
            right: 200px;
            height: 55px;
            width: 55px;
            border: 2px solid black;
            border-radius: 12px;
            z-index: 100;
        }
    </style>
</head>

<body>

    <div id="addQuestButtonArea">

    </div>

    <div id="topArea">
    </div>

    <div id="nav">
    </div>

    <div id="canvasArea">
        <canvas id="uiCanvas"></canvas>
        <canvas id="worldCanvas"></canvas>
    </div>


    <script type="module" src="../static//js/main.js"></script>
</body>

</html>
