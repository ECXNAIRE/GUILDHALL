<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        @font-face {
            font-family: "font1";
            src: url("../static/fonts/Excalifont-Regular.woff2") format("woff2");
        }



        * {
            box-sizing: border-box;
            font-family: font1;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            background: #C8B48A;
            font-family: font1;
            background: linear-gradient(180deg,
                    #9C7A49 0%,
                    #75532C 100%);
        }

        #canvasArea {
            position: absolute;
            bottom: 20px;
            right: 100px;
            height: 632px;
            width: 1000px;
            border: 2px solid rgba(0, 0, 0, 0);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #worldCanvas {
            width: calc(100% - 100px);
            height: calc(100% - 100px);
            background: #EAD7AE;
            z-index: 0;
        }

        #uiCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #topArea {
            position: absolute;
            top: 35px;
            left: 100px;
            width: 180px;
            height: 45px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            background: #EAD7AE;
            border-radius: 12px;
            display: flex;
            flex-direction: row;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
        }

        #optionsSection {
            position: absolute;
            top: 90px;
            left: 30px;
            width: 250px;
            height: 500px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            background: #EAD7AE;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
            padding: 10px;
            gap: 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #guildHeader {
            flex-shrink: 0;
            text-align: center;
            border-bottom: 2px solid rgba(75, 46, 24, .25);
            font-weight: 900
        }

        #guildList {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px;
        }


        .options {
            flex-shrink: 0;
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            background: #9B6A32;
            color: #2F1B0F;
        }

        .options:hover {
            cursor: pointer;
            background: #A87439;
        }

        .options.active {
            background: #6F4721;
            color: #F2DFC0;
            border-top: 2px solid #F0D99A;
            border-left: 2px solid #F0D99A;
            border-right: 4px solid #2B1708;
            border-bottom: 4px solid #2B1708;
        }

        #guildList::-webkit-scrollbar {
            width: 6px;
        }

        #guildList::-webkit-scrollbar-track {
            background: #D8C08F;
            border-radius: 10px;
        }

        #guildList::-webkit-scrollbar-thumb {
            background: #7A4F25;
            border-radius: 10px;
        }

        #guildList::-webkit-scrollbar-thumb:hover {
            background: #5E3B1A;
        }

        #addQuestButtonArea {
            position: absolute;
            top: 90px;
            right: 190px;
            height: 45px;
            width: 150px;
            z-index: 30;
        }

        #pfp {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            margin-left: 10px
        }

        #pfp img {
            width: 32px;
            height: 32px;
            border-radius: 5px;
            border: 1px solid black;
        }

        #details {
            margin-left: 5px;
        }

        #alias {
            font-family: sans-serif;
            font-size: 10px;
            opacity: 0.8;
            font-weight: 600;
        }

        #userID {
            font-family: sans-serif;
            font-size: 9px;
            opacity: 0.5;
        }


        #openProfile {
            margin-left: 50px;
            cursor: pointer;
        }

        #logoutArea {
            position: absolute;
            width: 45px;
            height: 45px;
            top: 35px;
            left: 30px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            background: #EAD7AE;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #logoutArea img {
            width: 25px;
            height: 25px;
            opacity: 0.8;
        }

        #addQuest {
            width: 100%;
            height: 100%;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            border-radius: 12px;
            display: flex;
            background: #9B6A32;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #2F1B0F
        }

        #addQuest:hover {
            transform: scale(1.02);
        }

        #questPopup {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 760px;
            height: 500px;
            background: white;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            border-radius: 12px;
            z-index: 40;
            background: #EAD7AE;
            display: none;
            flex-shrink: 0;
            flex-direction: column;
            gap: 20px;
            overflow-y: hidden;
            padding: 10px;
            overflow-x: hidden;
        }

        #popupContent {
            height: 100%;
            width:100%;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-shrink: 0;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            gap: 20px;

        }

        #popupContent::-webkit-scrollbar {
            width: 6px;
        }

        #popupContent::-webkit-scrollbar-track {
            background: #D8C08F;
            border-radius: 10px;
        }

        #popupContent::-webkit-scrollbar-thumb {
            background: #7A4F25;
            border-radius: 10px;
        }

        #popupContent::-webkit-scrollbar-thumb:hover {
            background: #5E3B1A;
        }

        #overlay {
            z-index: 35;
            position: absolute;
            width: 100%;
            height: 100%;
            background: #26170c;
            opacity: 0.5;
            display: none;
        }

        #description {
            width: 100%;
            height: 150px;
            border: 2px solid #d1bb8ece;
            border-radius: 10px;
            position: relative;
        }

        #title {
            width: 100%;
            height: 50px;
            border: 2px solid #d1bb8ece;
            border-radius: 10px;
            position: relative;
        }

        #titleTextArea {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: 700;
            padding: 10px;
            color: #5E3B1A;
        }

        #titleCounter,
        #descriptionCounter {
            position: absolute;
            right: 10px;
            bottom: 6px;
            font-size: 11px;
            color: #8A6A45;
            pointer-events: none;
        }

        #titleTextArea::placeholder {
            color: #5E3B1A;
        }

        #descriptionTextArea {
            width: 100%;
            height: 100%;
            border: none;
            color: #9B6A32;
            font-size: 12px;
            border: none;
            background: transparent;
            padding: 10px;
            resize: none;
        }

        #descriptionTextArea::placeholder {
            color: #9B6A32;
        }


        #titleTextArea:focus,
        #descriptionTextArea:focus {
            outline: none;
            box-shadow: none;
        }

        #header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 1000;
        }

        .tagBox {
            width: 400px;
        }

        #tagSearch {
            width: 50%;
            height: 40px;
            border: 2px solid #d1bb8ece;
            border-radius: 10px;
            background: transparent;
            padding: 0 12px;
            color: #5E3B1A;
            font-size: 12px;
        }

        #tagSearch:focus {
            outline: none;
        }

        #tagSearch::placeholder {
            color: #9B6A32
        }

        #selectedTags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .tag button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }


        #tag-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }


        .suggestion {
            padding: 8px 14px;
            border: 1px solid #d1bb8ece;
            color:#5E3B1A;
            border-radius: 20px;
            cursor: pointer;
        }

        #title,
        #description {
            flex-shrink: 0;
        }

        .tag {
            background: #9B6A32;
            color: #F2DFC0;
            padding: 6px 12px;
            display: inline-flex;
            align-items: center;
            border: 2px solid #6F4721;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="addQuestButtonArea">
        <button id="addQuest">+ ADD QUEST</button>
    </div>
    <div id="logoutArea">
        <img src="../static/images/log-out.svg">
    </div>

    <div id="topArea">
        <div id="pfp">
            <img id="profilepic">
        </div>
        <div id="details">
            <div id="alias">PRASHANT</div>
            <div id="userID"></div>
        </div>
        <div id="openProfile">></div>
    </div>

    <div id="optionsSection">
        <div id="guildHeader">
            GUILD REGISTERY
        </div>


        <div id="guildList">
            <button class="options active">FORGE</button>
            <button class="options">ARTISAN'S GUILD</button>
            <button class="options">TINKER'S WORKSHOP</button>
            <button class="options">ARCANE'S LABORATORY</button>
            <button class="options">GAMEKEEPER'S LODGE</button>
            <button class="options">BARD'S STUDIO</button>
            <button class="options">SCRIBBLE'S DESK</button>
            <button class="options">ENGINEER'S WORKSHOP</button>
            <button class="options">ODD JOBS</button>
        </div>
    </div>

    <div id="canvasArea">
        <canvas id="uiCanvas"></canvas>
        <canvas id="worldCanvas"></canvas>
    </div>

    <div id="overlay"></div>

    <div id="questPopup">
        <div id="popupContent">
            <div id="header">NEW QUEST</div>
            <div id="title"><input type="text" id="titleTextArea" placeholder="ENTER TITLE..." maxlength="80">
                <div id="titleCounter">0 / 80</div>
            </div>
            <div id="description"><textarea id="descriptionTextArea" placeholder="ENTER DESCRIPTION..."
                    maxlength="500"></textarea>
                <div id="descriptionCounter">0 / 500</div>
            </div>
            <div id="difficultyLevel"></div>

            <div id="tagBox">
                <label>TAGS</label>
                <input id="tagSearch" type="text" placeholder="SEARCH TAGS" ...>
                <div id="tag-suggestions"></div>
                <div id="selectedTags"></div>
            </div>
        </div>
    </div>

    <script type="module" src="../static//js/main.js"></script>
    <script>
        const user = JSON.parse('{{ user | tojson | safe }}');
        document.getElementById("profilepic").src = user.avatar;
        document.getElementById("userID").textContent = user.user_id
        document.getElementById("alias").textContent = user.user_name


        //TITLE COUNTER
        const titleInput = document.getElementById("titleTextArea")
        const titleCounter = document.getElementById("titleCounter")

        titleInput.addEventListener("input", () => {
            titleCounter.textContent = `${titleInput.value.length} / 80`
        })

        //DESCRIPTION COUNTER
        const descriptionInput = document.getElementById("descriptionTextArea")
        const descriptionCounter = document.getElementById("descriptionCounter")

        descriptionInput.addEventListener("input", () => {
            descriptionCounter.textContent = `${descriptionInput.value.length} / 500`
        })
    </script>

    <script src="../static/js/quest.js"></script>
</body>

</html>
