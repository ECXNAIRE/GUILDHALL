<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        @font-face {
            font-family: "font1";
            src: url("../static/fonts/Excalifont-Regular.woff2") format("woff2");
        }

        * {
            box-sizing: border-box;
            font-family: font1;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #C8B48A;
            font-family: font1;
            background: linear-gradient(180deg,
                    #B89A68 0%,
                    #9E7E4F 100%);
        }

        #canvasArea {
            position: absolute;
            bottom: 20px;
            right: 100px;
            height: 632px;
            width: 1000px;
            border: 2px solid rgba(0, 0, 0, 0);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #worldCanvas {
            width: calc(100% - 100px);
            height: calc(100% - 100px);
            background: #EAD7AE;
            z-index: 0;
        }

        #uiCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #topArea {
            position: absolute;
            top: 35px;
            left: 30px;
            width: 250px;
            height: 45px;
            border: 2px solid black;
            background: #EAD7AE;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #optionsSection {
            position: absolute;
            top: 90px;
            left: 30px;
            width: 250px;
            height: 500px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            background: #EAD7AE;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            z-index: 10;
            padding: 10px;
            gap: 20px;
            overflow-y: auto;
            overflow-x: hidden;
        }

        #guildHeader {
            flex-shrink: 0;
            text-align: center;
            border-bottom: 2px solid rgba(75, 46, 24, .25);
            font-weight: 900
        }

        #guildList {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 10px;
        }


        .options {
            flex-shrink: 0;
            width: 100%;
            height: 50px;
            border-radius: 12px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            background: #9B6A32;
            color: #2F1B0F;
        }

        .options:hover {
            cursor: pointer;
            background: #A87439;
        }

        .options.active {
            background: #6F4721;
            color: #F2DFC0;
            border-top: 2px solid #F0D99A;
            border-left: 2px solid #F0D99A;
            border-right: 4px solid #2B1708;
            border-bottom: 4px solid #2B1708;
        }

        #guildList::-webkit-scrollbar {
            width: 8px;
        }

        #guildList::-webkit-scrollbar-track {
            background: #D8C08F;
            border-radius: 10px;
        }

        #guildList::-webkit-scrollbar-thumb {
            background: #7A4F25;
            border-radius: 10px;
        }

        #guildList::-webkit-scrollbar-thumb:hover {
            background: #5E3B1A;
        }

        #addQuestButtonArea {
            position: absolute;
            top: 90px;
            right: 190px;
            height: 45px;
            width: 150px;
            border-top: 2px solid #D8B46A;
            border-left: 2px solid #D8B46A;
            border-right: 4px solid #4B2E18;
            border-bottom: 4px solid #4B2E18;
            border-radius: 12px;
            z-index: 100;
            display: flex;
            background: #9B6A32;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #2F1B0F
        }

        #addQuestButtonArea:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <div id="addQuestButtonArea">
        + ADD QUEST
    </div>

    <div id="topArea">
    </div>

    <div id="optionsSection">
        <div id="guildHeader">
            GUILD REGISTERY
        </div>


        <div id="guildList">
            <button class="options active">FORGE</button>
            <button class="options">ARTISAN'S GUILD</button>
            <button class="options">TINKER'S WORKSHOP</button>
            <button class="options">ARCANE'S LABORATORY</button>
            <button class="options">GAMEKEEPER'S LODGE</button>
            <button class="options">BARD'S STUDIO</button>
            <button class="options">SCRIBBLE'S DESK</button>
            <button class="options">ENGINEER'S WORKSHOP</button>
            <button class="options">ODD JOBS</button>
        </div>
    </div>

    <div id="canvasArea">
        <canvas id="uiCanvas"></canvas>
        <canvas id="worldCanvas"></canvas>
    </div>


    <script type="module" src="../static//js/main.js"></script>
</body>

</html>
