<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUILDHALL</title>

    <style>
        @font-face {
            font-family: "font1";
            src: url("../static/fonts/Excalifont-Regular.woff2") format("woff2");
        }

        * {
            box-sizing: border-box;
            font-family: font1;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        body {
            background: #C8B48A;
            font-family: font1;
            background: linear-gradient(180deg,
                    #9C7A49 0%,
                    #75532C 100%);
        }

        #profileEditArea {
            width: 100%;
            height: 100%
        }

        #profilePic {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 13px;
            overflow: visible;
        }

        #profilePic>img:first-child {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }

        #editPfp {
            position: absolute;
            width: 42px;
            height: 42px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            background: linear-gradient(180deg, #D8B56C 0%, #B8873A 100%);
            border: 2px solid #5B3A1B;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .35);
            padding: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="profileEditArea">
        <div id="profilePic">
            <img
                src="https://lh3.googleusercontent.com/a/ACg8ocKtigmoRSURyutQh02oCh86L0hotrUxyZyoplW8oPp8qb0RNIYt=s96-c">
            <img id="editPfp" src="../static/images/editIcon.png">
        </div>

        <div id="userInfo">
            <div id="userName"></div>
            <div id="userBio"></div>
            <div id="userSkills"></div>
            <div id="userScials"></div>
        </div>

        <div id="buttonArea"></div>
    </div>
</body>

</html>
